    <text style="font-size: 12px; font-family: 'Arial'; fill: #172d42" transform="translate(82.330875 209.382263)">Global context 29</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #172d42" transform="translate(57.221812 226.3692)">Training-only normalization</text>
   </g>
