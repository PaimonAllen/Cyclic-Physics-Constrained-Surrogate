   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Arial'; text-anchor: middle; fill: #172d42" x="576" y="42.87015" transform="rotate(-0 576 42.87015)">Physics-constrained cyclic response surrogate</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Arial'; text-anchor: middle; fill: #172d42" x="576" y="74.03895" transform="rotate(-0 576 74.03895)">12 rails  ·  6 local features  ·  29 global features  ·  latent width 256</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #172d42" transform="translate(66.502125 175.2072)">Command + query time</text>
